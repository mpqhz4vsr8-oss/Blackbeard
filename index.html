<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blackbeard Card Dealer</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Courier+Prime:wght@400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1008;--parchment:#f0e6c8;--parch-dk:#d4c49a;--blood:#8b1a1a;--gold:#c8960c;--gold-lt:#e8b84b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0a06;min-height:100vh;font-family:'IM Fell English',serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;}
.app-header{width:100%;text-align:center;padding:22px 16px 10px;}
.app-header h1{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(2rem,8.5vw,3rem);color:var(--gold-lt);text-shadow:0 2px 10px rgba(0,0,0,.9);letter-spacing:4px;}
.header-rule{width:70%;max-width:360px;height:2px;margin:8px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.conn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#555;transition:background .3s;}
.conn-dot.connected{background:#4a9;}
.conn-status{font-family:'Courier Prime',monospace;font-size:.6rem;color:var(--parch-dk);letter-spacing:1px;text-align:center;margin-bottom:8px;min-height:1.2em;}
.screen{display:none;width:100%;max-width:480px;padding:10px 14px 36px;}
.screen.active{display:block;}
.setup-title{font-style:italic;color:var(--parch-dk);text-align:center;font-size:1.05rem;margin-bottom:20px;opacity:.85;}
.name-row{display:flex;align-items:center;gap:10px;background:var(--parchment);border:2px solid var(--gold);border-radius:6px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.35);margin-bottom:12px;}
.name-row .skull-label{font-size:1.5rem;flex-shrink:0;}
.name-row input{flex:1;background:none;border:none;border-bottom:1.5px solid var(--parch-dk);font-family:'IM Fell English',serif;font-size:1rem;color:var(--ink);padding:3px 0;outline:none;}
.name-row input::placeholder{color:#a08050;font-style:italic;opacity:.7;}
.waiting-box{background:var(--parchment);border:2px solid var(--gold);border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 3px 10px rgba(0,0,0,.4);}
.waiting-label{font-family:'Courier Prime',monospace;font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--blood);margin-bottom:8px;}
.player-list{display:flex;flex-direction:column;gap:6px;}
.player-pill{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink);}
.player-pill .pk{font-size:1.1rem;}
.waiting-hint{font-family:'Courier Prime',monospace;font-size:.65rem;color:#8a6030;margin-top:10px;font-style:italic;}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#8b1a1a,#6b1010);color:var(--parchment);font-family:'UnifrakturMaguntia',cursive;font-size:1.4rem;letter-spacing:2px;border:2px solid var(--gold);border-radius:6px;cursor:pointer;box-shadow:0 4px 0 #3d0808,0 6px 16px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s;margin-top:8px;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 0 #3d0808,0 10px 20px rgba(0,0,0,.6);}
.btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 #3d0808;}
.btn-primary:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 4px 0 #3d0808;}
.btn-link{display:block;margin:12px auto 0;background:none;border:none;color:var(--parch-dk);font-family:'IM Fell English',serif;font-style:italic;font-size:.82rem;cursor:pointer;opacity:.5;text-decoration:underline;}
.btn-link:hover{opacity:.85;}
.active-player-banner{background:var(--parchment);border:2px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 10px rgba(0,0,0,.5);}
.active-skull{font-size:2.4rem;line-height:1;flex-shrink:0;}
.active-player-text{flex:1;min-width:0;}
.active-player-label{font-family:'Courier Prime',monospace;font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blood);margin-bottom:2px;}
.active-player-name{font-family:'UnifrakturMaguntia',cursive;font-size:1.6rem;color:var(--ink);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.deck-status{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.deck-count{font-family:'Courier Prime',monospace;font-size:.68rem;color:var(--parch-dk);letter-spacing:1px;}
.deck-count span{color:var(--gold-lt);font-weight:700;font-size:.88rem;}
.btn-shuffle{background:none;border:1.5px solid var(--gold);color:var(--gold-lt);font-family:'Courier Prime',monospace;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:3px;cursor:pointer;transition:background .15s,color .15s;}
.btn-shuffle:hover{background:var(--gold);color:var(--ink);}
.card{background:var(--parchment);border:3px solid var(--ink);border-radius:8px;padding:16px 16px 14px;box-shadow:4px 6px 0 #0d0a06,0 10px 28px rgba(0,0,0,.6),inset 0 0 0 1px rgba(200,150,12,.2);position:relative;overflow:hidden;margin-bottom:12px;}
.card::before{content:'';position:absolute;inset:6px;border:1px solid rgba(200,150,12,.18);border-radius:4px;pointer-events:none;}
.card-empty{text-align:center;padding:44px 16px;color:#a08050;font-style:italic;font-size:.95rem;}
.card-top{display:grid;grid-template-columns:1fr auto auto;align-items:start;margin-bottom:12px;gap:8px;}
.card-action{color:var(--parchment);font-family:'Courier Prime',monospace;font-weight:700;font-size:.68rem;letter-spacing:.8px;text-transform:uppercase;padding:6px 9px;border-radius:3px;line-height:1.4;background:var(--blood);}
.card-action.go{background:#1a1a1a;color:#e8b84b;font-size:.72rem;letter-spacing:1.5px;}
.card-sl-wrap{display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0;}
.ship-svg{width:44px;height:40px;display:block;}
.card-sl{font-family:'Courier Prime',monospace;font-weight:700;font-size:1.4rem;color:var(--ink);line-height:1;text-align:center;margin-top:1px;}
.card-kc{font-family:'Courier Prime',monospace;font-weight:700;font-size:.68rem;color:var(--blood);letter-spacing:1px;align-self:start;padding-top:4px;}
.card-section{margin-bottom:9px;}
.card-label{font-family:'Courier Prime',monospace;font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--blood);margin-bottom:3px;}
.card-value{font-size:.9rem;color:var(--ink);line-height:1.35;}
.mdr-tag{font-family:'Courier Prime',monospace;font-size:.62rem;color:var(--blood);font-weight:700;letter-spacing:1px;margin-left:6px;}
.cargo-table{width:100%;border-collapse:collapse;font-family:'Courier Prime',monospace;font-size:.78rem;}
.cargo-table th{background:var(--ink);color:var(--parchment);padding:5px 6px;text-align:center;font-size:.65rem;letter-spacing:.8px;white-space:nowrap;}
.cargo-table th:first-child{text-align:left;}
.cargo-table td{padding:5px 6px;border-bottom:1px solid var(--parch-dk);text-align:center;}
.cargo-table td:first-child{text-align:left;font-size:.72rem;color:#4a2a0a;white-space:nowrap;}
.cargo-table tr:nth-child(even) td{background:rgba(0,0,0,.045);}
.cargo-table .hp-col{font-weight:700;color:var(--blood);font-size:.8rem;}
.card-bottom{display:flex;gap:14px;margin-top:4px;}
.card-bottom .card-section{flex:1;margin-bottom:0;}
.inj-note{font-size:.72rem;font-style:italic;color:#5a3a1a;line-height:1.35;margin-top:3px;}
.btn-draw{width:100%;padding:15px;background:linear-gradient(135deg,#8b1a1a,#6b1010);color:var(--parchment);font-family:'UnifrakturMaguntia',cursive;font-size:1.5rem;letter-spacing:2px;border:2px solid var(--gold);border-radius:6px;cursor:pointer;box-shadow:0 4px 0 #3d0808,0 6px 18px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s;}
.btn-draw:hover{transform:translateY(-2px);box-shadow:0 6px 0 #3d0808,0 10px 22px rgba(0,0,0,.6);}
.btn-draw:active{transform:translateY(2px);box-shadow:0 2px 0 #3d0808;}
.btn-draw:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 4px 0 #3d0808;}
@keyframes reveal{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.card.show{animation:reveal .28s ease forwards;}
</style>
</head>
<body>
<div class="app-header">
  <h1>☠ Blackbeard</h1>
  <div class="header-rule"></div>
</div>
<div class="conn-status"><span class="conn-dot" id="conn-dot"></span><span id="conn-text"></span></div>
<div class="screen active" id="s-join">
  <p class="setup-title">Enter your pirate name to join the crew</p>
  <div class="name-row">
    <span class="skull-label">💀</span>
    <input id="input-name" type="text" placeholder="Your pirate name…" maxlength="20">
  </div>
  <button class="btn-primary" onclick="joinGame()">⚓ Join Game</button>
</div>
<div class="screen" id="s-lobby">
  <div class="waiting-box">
    <div class="waiting-label">Crew Manifest</div>
    <div class="player-list" id="player-list"></div>
    <div class="waiting-hint">Waiting for 1–4 pirates…</div>
  </div>
  <button class="btn-primary" id="btn-start" onclick="startGame(false)" disabled>⚔ Start Game</button>
  <button class="btn-primary" id="btn-solo" onclick="startGame(true)" disabled style="background:linear-gradient(135deg,#1a1a1a,#333);margin-top:6px;">🏴‍☠️ Start Solo (+ 2 bots)</button>
  <p style="font-family:'Courier Prime',monospace;font-size:.6rem;color:#6a5030;text-align:center;margin-top:8px;">Solo adds 2 bot pirates to the crew</p>
</div>
<div class="screen" id="s-game">
  <div class="active-player-banner">
    <div class="active-skull">💀</div>
    <div class="active-player-text">
      <div class="active-player-label">Active Pirate</div>
      <div class="active-player-name" id="banner-name">—</div>
    </div>
  </div>
  <div class="deck-status">
    <div class="deck-count">Cards remaining: <span id="deck-count">40</span></div>
    <button class="btn-shuffle" onclick="doShuffle()">⚓ Shuffle</button>
  </div>
  <div class="card" id="card-display"><div class="card-empty">Draw a card to begin your plunder</div></div>
  <button class="btn-draw" id="btn-draw" onclick="doDraw()">Draw Card</button>
  <button class="btn-link" onclick="doReset()">↩ New game</button>
</div>

var SHIP_SVG='<svg class="ship-svg" viewBox="0 0 60 56" xmlns="http://www.w3.org/2000/svg"><path d="M4 44 Q30 52 56 44" stroke="#3a6080" stroke-width="1.2" fill="none" opacity=".4"/><path d="M10 38 Q30 46 50 38 L47 44 Q30 50 13 44 Z" fill="#2a1a08" stroke="#1a1008" stroke-width="1.2"/><path d="M13 40 Q30 47 47 40" stroke="#3a2a10" stroke-width=".8" fill="none"/><rect x="11" y="34" width="38" height="5" rx="1" fill="#4a2e10" stroke="#1a1008" stroke-width="1"/><rect x="40" y="30" width="10" height="7" rx="1" fill="#3a2008" stroke="#1a1008" stroke-width=".8"/><path d="M11 36 L6 33 L11 34" fill="#2a1a08" stroke="#1a1008" stroke-width=".8"/><line x1="28" y1="4" x2="28" y2="36" stroke="#1a1008" stroke-width="2" stroke-linecap="round"/><line x1="42" y1="14" x2="42" y2="34" stroke="#1a1008" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="10" x2="16" y2="35" stroke="#1a1008" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="14" x2="40" y2="14" stroke="#1a1008" stroke-width="1.2"/><path d="M28 6 L40 14 L40 30 L28 30 Z" fill="#c8a050" stroke="#8b6508" stroke-width=".8" opacity=".9"/><path d="M28 6 L16 14 L16 30 L28 30 Z" fill="#d4b060" stroke="#8b6508" stroke-width=".8" opacity=".9"/><path d="M16 12 L26 18 L26 32 L16 32 Z" fill="#c8a050" stroke="#8b6508" stroke-width=".7" opacity=".85"/><path d="M42 16 L42 30 L34 30 L34 20 Z" fill="#c8a050" stroke="#8b6508" stroke-width=".7" opacity=".85"/><line x1="11" y1="33" x2="2" y2="26" stroke="#1a1008" stroke-width="1.3" stroke-linecap="round"/><path d="M11 33 L2 26 L16 14" stroke="#8b6508" stroke-width=".7" fill="#d4b060" opacity=".7"/><path d="M28 4 L36 2 L28 0 Z" fill="#8b1a1a"/><ellipse cx="28" cy="14" rx="4" ry="2" fill="#3a2008" stroke="#1a1008" stroke-width=".8"/></svg>';

// ── GIST BACKEND ──
// Token is passed via URL hash: page.html#TOKEN
// First visit saves it to localStorage, then hash is cleared from URL
var GIST_ID='c0076cf3cc09fcb6b2a3f41429bfd35e';
var GH_TOKEN='';
(function(){
  var h=location.hash.slice(1);
  if(h&&h.length>10){localStorage.setItem('bb_tk',h);GH_TOKEN=h;history.replaceState(null,'',location.pathname);}
  else{GH_TOKEN=localStorage.getItem('bb_tk')||'';}
})();
var GIST_URL='https://api.github.com/gists/'+GIST_ID;
function gHeaders(){return{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json'};}

var myName='',pollTimer=null,lastVersion=-1;

async function gistGet(){var r=await fetch(GIST_URL+'?_='+Date.now(),{headers:gHeaders(),cache:'no-store'});if(!r.ok)throw new Error(r.status);var g=await r.json();return JSON.parse(g.files['state.json'].content);}
async function gistSet(state){var r=await fetch(GIST_URL,{method:'PATCH',headers:gHeaders(),body:JSON.stringify({files:{'state.json':{content:JSON.stringify(state)}}})});if(!r.ok)throw new Error(r.status);}
function shuffle(a){var arr=a.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function freshDeck(){var a=[];for(var i=0;i<40;i++)a.push(i);return shuffle(a);}
async function poll(){try{var s=await gistGet();if(!s){setConn(true);return;}if(s.version!==lastVersion){lastVersion=s.version;applyState(s);}setConn(true);}catch(e){setConn(false);}}
function setConn(ok){document.getElementById('conn-dot').classList.toggle('connected',ok);document.getElementById('conn-text').textContent=ok?'Connected':'Reconnecting…';}
function applyState(s){if(s.phase==='lobby'){if(!myName){showScreen('s-join');return;}showScreen('s-lobby');renderLobby(s);}else if(s.phase==='game'){showScreen('s-game');renderGame(s);}}
function renderLobby(s){var em=['⚓','🗡️','🏴‍☠️','💀'];var pl=s.players||[];document.getElementById('player-list').innerHTML=pl.map(function(p,i){return '<div class="player-pill"><span class="pk">'+(em[i]||'☠️')+'</span> '+p.name+'</div>';}).join('');document.getElementById('btn-start').disabled=pl.length<2;document.getElementById('btn-solo').disabled=pl.length<1;}
function renderGame(s){document.getElementById('banner-name').textContent=s.currentPlayer||'—';document.getElementById('deck-count').textContent=(s.deck||[]).length;document.getElementById('btn-draw').disabled=(s.deck||[]).length===0;if(s.currentCard!==null&&s.currentCard!==undefined)renderCard(CARDS[s.currentCard]);else{var el=document.getElementById('card-display');el.className='card';el.innerHTML='<div class="card-empty">Draw a card to begin your plunder</div>';}}
function renderCard(c){var rows=['NA','CAR','GC','IND'];var tbody=rows.map(function(r){return '<tr><td>'+REGION_NAMES[r]+'</td><td>'+c.cargo[r][0]+'</td><td>'+c.cargo[r][1]+'</td><td>'+c.cargo[r][2]+'</td><td class="hp-col">'+c.hp[r]+'</td></tr>';}).join('');var act=c.action?'<div class="card-action">'+c.action+'</div>':'<div class="card-action go">Active Player Go</div>';var srch=c.search.split('\n').join('<br>');var mdr=c.mdr?'<span class="mdr-tag">Mandatory D&amp;R</span>':'';var injFull=c.inj?c.injury+'<div class="inj-note">'+c.inj+'</div>':c.injury;var el=document.getElementById('card-display');el.className='card show';el.innerHTML='<div class="card-top">'+act+'<div class="card-sl-wrap">'+SHIP_SVG+'<div class="card-sl">'+c.sl+'</div></div><div class="card-kc">'+(c.kc?'KC':'')+'</div></div><div class="card-section"><div class="card-label">Event</div><div class="card-value">'+c.event+'</div></div><div class="card-section"><div class="card-label">Search</div><div class="card-value">'+srch+'</div></div><div class="card-section"><div class="card-label">Cargo Manifest'+mdr+'</div><table class="cargo-table"><thead><tr><th>Region</th><th>2–4</th><th>5–6</th><th>7–8</th><th>Home Port</th></tr></thead><tbody>'+tbody+'</tbody></table></div><div class="card-bottom"><div class="card-section"><div class="card-label">Hostage</div><div class="card-value">'+c.hostage+'</div></div><div class="card-section"><div class="card-label">Injury</div><div class="card-value">'+injFull+'</div></div></div>';setTimeout(function(){el.classList.remove('show');},350);}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}
async function joinGame(){var ph=['Black Bart','Calico Jack','Anne Bonny','Mary Read'];var val=document.getElementById('input-name').value.trim();myName=val||ph[Math.floor(Math.random()*ph.length)];var s=await gistGet();var pl=s.players||[];if(!pl.find(function(p){return p.name===myName;}))pl.push({name:myName});s.players=pl;s.version=(s.version||0)+1;lastVersion=s.version;await gistSet(s);showScreen('s-lobby');renderLobby(s);}
async function startGame(solo){var s=await gistGet();if(!s||!s.players||s.players.length<1)return;if(solo){var botNames=['Davy Jones','Kraken'];for(var b=0;b<botNames.length;b++){if(!s.players.find(function(p){return p.name===botNames[b];}))s.players.push({name:botNames[b],bot:true});}}if(s.players.length<2)return;s.phase='game';s.deck=freshDeck();s.currentCard=null;s.currentPlayer=null;s.cardsDrawn=0;s.version=(s.version||0)+1;lastVersion=s.version;await gistSet(s);showScreen('s-game');renderGame(s);}
async function doDraw(){var s=await gistGet();if(!s||s.phase!=='game'||(s.deck||[]).length===0)return;var deck=s.deck.slice();var cardIdx=deck.pop();var pc=(s.players||[]).length;var pos=pc<=1?1:(ACTIVE[pc]?ACTIVE[pc][cardIdx]:1);var pIdx=(pos||1)-1;var currentPlayer=s.players[pIdx]?s.players[pIdx].name:s.players[0].name;s.deck=deck;s.currentCard=cardIdx;s.currentPlayer=currentPlayer;s.cardsDrawn=(s.cardsDrawn||0)+1;s.version=(s.version||0)+1;lastVersion=s.version;await gistSet(s);renderGame(s);}
async function doShuffle(){var s=await gistGet();if(!s||s.phase!=='game')return;s.deck=freshDeck();s.currentCard=null;s.cardsDrawn=0;s.version=(s.version||0)+1;lastVersion=s.version;await gistSet(s);renderGame(s);}
async function doReset(){var s={phase:'lobby',players:[],deck:[],currentCard:null,currentPlayer:null,cardsDrawn:0,version:(lastVersion||0)+1};lastVersion=s.version;await gistSet(s);myName='';showScreen('s-join');}
function init(){if(!GH_TOKEN){document.getElementById('conn-text').textContent='No token — open link with #token';return;}poll();if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(poll,3000);}
init();
document.getElementById('input-name').addEventListener('keydown',function(e){if(e.key==='Enter')joinGame();});
</script>
